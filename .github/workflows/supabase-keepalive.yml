name: Supabase keep-alive

# The Supabase free tier pauses inactive projects. This pings the database once a day.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # The anon role has no access to profiles, so this returns 401 —
          # but the query still runs in Postgres, which counts as activity.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then
            echo "Supabase did not respond. Check the SUPABASE_URL and SUPABASE_ANON_KEY secrets."
            exit 1
          fi
